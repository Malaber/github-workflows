name: reusable-appstore-creative
on:
  workflow_call:
    inputs:
      screenshot_artifact:
        description: Current-run artifact containing real demo screenshots.
        required: true
        type: string
      screenshot_glob:
        description: Glob within the artifact; must resolve to exactly one PNG.
        required: true
        type: string
      renderer:
        description: Caller-owned Python renderer accepting --screenshot and --output.
        default: marketing/creative/render.py
        type: string
      requirements:
        default: marketing/requirements.txt
        type: string
      output_artifact:
        default: appstore-creative
        type: string
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y inkscape
      - name: Install caller renderer dependencies
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: python -m pip install -r "$REQUIREMENTS"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.screenshot_artifact }}
          path: .tmp/creative-input
      - name: Render and fully validate universal assets
        env:
          SCREENSHOT_GLOB: ${{ inputs.screenshot_glob }}
          RENDERER: ${{ inputs.renderer }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          from PIL import Image
          root = pathlib.Path('.tmp/creative-input').resolve()
          candidates = list(root.glob(os.environ['SCREENSHOT_GLOB']))
          if len(candidates) != 1 or not candidates[0].resolve().is_relative_to(root):
              raise SystemExit('Expected exactly one screenshot within the downloaded artifact')
          output = pathlib.Path('.tmp/creative-output')
          subprocess.run([sys.executable, os.environ['RENDERER'], '--screenshot', str(candidates[0]), '--output', str(output)], check=True)
          for name in ('header', 'search-results'):
              if not (output / f'{name}.svg').is_file():
                  raise SystemExit(f'Missing editable {name}.svg')
              with Image.open(output / f'{name}.png') as image:
                  image.load()
                  if image.size != (5244, 2950) or image.mode != 'RGB':
                      raise SystemExit(f'Invalid opaque universal PNG: {name}')
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_artifact }}
          path: .tmp/creative-output/
          if-no-files-found: error
          retention-days: 14
